events {
  worker_connections 1024;
}

http {
  # ── Upstream app servers (horizontal scale — add more here) ─────────────
  upstream app_servers {
    least_conn;               # Route to the server with fewest active connections
    server app:8080;
    # server app2:8080;       # Uncomment to add more app servers
    # server app3:8080;
    keepalive 32;             # Persistent connections to upstream — reduces TCP overhead
  }

  # ── Rate limiting zone (shared across workers) ───────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=redirect:10m rate=50r/s;

  # ── Logging ──────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" $request_time';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # ── Optimisations ─────────────────────────────────────────────────────────
  sendfile        on;
  tcp_nopush      on;
  gzip            on;
  gzip_types      application/json text/plain;
  keepalive_timeout 65;

  server {
    listen 80;
    server_name _;

    # ── Health check (no rate limit, no logging) ─────────────────────────
    location /health {
      proxy_pass http://app_servers;
      access_log off;
    }

    # ── API endpoints ────────────────────────────────────────────────────
    location /api/ {
      limit_req zone=api burst=20 nodelay;

      proxy_pass         http://app_servers;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;

      proxy_connect_timeout 5s;
      proxy_read_timeout    30s;
    }

    # ── Short code redirect (the hot path) ───────────────────────────────
    location ~ "^/[A-Za-z0-9]{4,20}$" {
      limit_req zone=redirect burst=100 nodelay;

      proxy_pass         http://app_servers;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;

      proxy_connect_timeout 2s;
      proxy_read_timeout    5s;   # Redirects must be fast — fail quickly
    }

    # ── 404 for everything else ──────────────────────────────────────────
    location / {
      return 404 '{"success":false,"error":"Not found"}';
      add_header Content-Type application/json;
    }
  }
}
